[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
version = "0.1.9"
repository = "https://github.com/fobiat/cellar"
authors = ["Kyle <kyle@fobiat.dev>"]

[workspace.dependencies]
cellar-core = { path = "crates/cellar-core", version = "0.1.0" }
cellar-runtime = { path = "crates/cellar-runtime", version = "0.1.0" }
cellar-store = { path = "crates/cellar-store", version = "0.1.0" }
cellar-server = { path = "crates/cellar-server", version = "0.1.0" }
cellar-notify = { path = "crates/cellar-notify", version = "0.1.0" }
cellar-update = { path = "crates/cellar-update", version = "0.1.0" }
cellar-tui = { path = "crates/cellar-tui", version = "0.1.0" }
cellar-mariadb = { path = "crates/cellar-mariadb", version = "0.1.0" }
cellar-mcp = { path = "crates/cellar-mcp", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml_ng = "0.10"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "mysql",
  "json",
  "chrono",
  "migrate",
  # For `sqlx::migrate!` only. Queries are the runtime API, never `query!`, so
  # the build needs no live database and CI needs no MySQL to compile.
  "macros",
] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
portable-pty = "0.8"
sysinfo = "0.32"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
argon2 = "0.5"
rand = "0.8"
tempfile = "3"
# Extracting the archive a downloaded MariaDB release ships as. Cellar's own
# self-update deliberately avoids an in-process archive reader (see
# cellar-update's selfupdate.rs) by publishing a bare binary alongside the
# zip; MariaDB has no such bare-binary option, it is a directory tree of
# binaries, libraries and shared data, so there is no single-file
# alternative here.
zip = { version = "2", default-features = false, features = ["deflate"] }
rmcp = { version = "3.1.4", default-features = false, features = [
  "server",
  "client",
  "macros",
  "transport-io",
  "transport-child-process",
] }

# Enforced workspace-wide; each crate opts in with `[lints] workspace = true`.
# This process supervises a game server and a database, so every interesting
# failure is a `Result` rather than an assumption. Test modules opt out locally.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
