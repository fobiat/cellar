name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions: {}

jobs:
  gate:
    name: build, test, clippy, fmt
    # Never run fork pull requests on a private self-hosted runner. Public pull
    # requests can execute arbitrary checked-out code during the build.
    #
    # Actions minutes are billed on a private repository, and on 2026-08-25
    # every run here failed before starting on "recent account payments have
    # failed or your spending limit needs to be increased". Set the repository
    # variable `CI_RUNNER` to a self-hosted label to route around that, the same
    # way AppleJackRP pins to `kyle-x1carbon`. Making the repository public also
    # resolves it, since public repos are not billed.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read

    # The same MariaDB the integration tests expect. Without it they skip, which
    # would quietly turn the SQL half of this project into untested code.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: cellartest
          MARIADB_DATABASE: cellar
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pcellartest --silent ping"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: fmt
        run: cargo fmt --all --check

      - name: docs
        run: ./scripts/check-docs.sh
        shell: bash

      - name: examples
        run: ./scripts/check-examples.sh
        shell: bash

      - name: generated-file drift
        run: ./scripts/check-generated.sh
        shell: bash

      - name: build
        run: cargo build --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: wait for MariaDB TCP service
        run: |
          for attempt in $(seq 1 60); do
            if docker exec "${{ job.services.mariadb.id }}" \
              mariadb-admin --protocol=tcp -h 127.0.0.1 -P 3306 \
              -uroot -pcellartest --silent ping; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::MariaDB did not accept TCP connections within 60 seconds"
          exit 1

      - name: install MariaDB client tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y mariadb-client

      - name: test
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: cargo test --workspace

      # The database tests skip themselves when no server is configured, which
      # is right locally and wrong here. This proves they actually ran.
      - name: prove the database tests were not skipped
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: |
          output=$(cargo test -p cellar-store --test mysql -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping: CELLAR_TEST_DATABASE_URL is not set"; then
            echo "::error::the database tests skipped despite a configured server"
            exit 1
          fi

  windows:
    name: windows clean-checkout gate
    runs-on: ${{ github.event_name == 'pull_request' && 'windows-latest' || vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: fmt
        run: cargo fmt --all --check

      - name: docs
        run: ./scripts/check-docs.sh
        shell: bash

      - name: examples
        run: ./scripts/check-examples.sh
        shell: bash

      - name: generated-file drift
        run: ./scripts/check-generated.sh
        shell: bash

      - name: build
        run: cargo build --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        # ConPTY is reliable for these supervisor fixtures when one test owns
        # the console at a time. The product still supports multiple servers.
        run: cargo test --workspace -- --test-threads=1

  browser:
    name: browser and accessibility tests
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: build browser fixtures
        run: cargo build -p cellar-cli -p cellar-fake-server

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: install browser test dependencies
        run: npm ci --prefix tests/browser

      - name: install Chromium
        run: npx playwright install --with-deps chromium

      - name: run browser and accessibility tests
        run: npm test --prefix tests/browser

  notify-discord:
    name: notify
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [gate, windows, browser]
    if: always()
    permissions: {}
    steps:
      - name: post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # A quiet no-op when the secret is unset, so a fork's CI does not fail
          # on a credential it was never going to have.
          if [ -z "${WEBHOOK}" ]; then
            echo "no DISCORD_WEBHOOK_URL configured; skipping"
            exit 0
          fi

          if [ "${{ needs.gate.result }}" = "success" ] && [ "${{ needs.windows.result }}" = "success" ] && [ "${{ needs.browser.result }}" = "success" ]; then
            colour=7317090   # orchard
            state="passed"
          else
            colour=14310221  # russet
            state="failed"
          fi

          jq -n \
            --arg title "CI ${state}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg desc "\`${{ github.ref_name }}\` · ${{ github.event_name }} · linux ${{ needs.gate.result }}, windows ${{ needs.windows.result }}, browser ${{ needs.browser.result }}" \
            --argjson colour "${colour}" \
            '{embeds:[{title:$title, url:$url, description:$desc, color:$colour}]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "${WEBHOOK}"
