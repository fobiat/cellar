name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gate:
    name: build, test, clippy, fmt
    # GitHub-hosted by default, overridable to a self-hosted runner.
    #
    # Actions minutes are billed on a private repository, and on 2026-08-25
    # every run here failed before starting on "recent account payments have
    # failed or your spending limit needs to be increased". Set the repository
    # variable `CI_RUNNER` to a self-hosted label to route around that, the same
    # way AppleJackRP pins to `kyle-x1carbon`. Making the repository public also
    # resolves it, since public repos are not billed.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    # The same MariaDB the integration tests expect. Without it they skip, which
    # would quietly turn the SQL half of this project into untested code.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: cellartest
          MARIADB_DATABASE: cellar
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -uroot -pcellartest --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: docs
        run: ./scripts/check-docs.sh

      - name: build
        run: cargo build --workspace --all-targets

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: cargo test --workspace

      # The database tests skip themselves when no server is configured, which
      # is right locally and wrong here. This proves they actually ran.
      - name: prove the database tests were not skipped
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: |
          output=$(cargo test -p cellar-store --test mysql -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping: CELLAR_TEST_DATABASE_URL is not set"; then
            echo "::error::the database tests skipped despite a configured server"
            exit 1
          fi

  windows:
    name: windows build
    # GitHub-hosted by default, overridable to a self-hosted runner: there was
    # no Windows runner to route to before, so this job pinned to
    # windows-latest and stayed permanently red on the same billing block the
    # `gate` job's comment above describes. `CI_WINDOWS_RUNNER` is separate
    # from `CI_RUNNER` because they need different label sets (this one is a
    # Windows label, not `cellar-runners`).
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The dedicated server is Windows-only, so this target is not optional.
      #
      # Build only, not test: cellar-windows runs as a Windows service
      # (NETWORK SERVICE, Session 0), which has no interactive desktop, and
      # ConPTY allocation hangs forever without one. cargo test hung here for
      # 16 minutes until GitHub cancelled the job. The Linux gate job already
      # exercises everything except ConPTY itself (it uses forkpty instead),
      # so this job's job is the Windows-only compile check, which the repo
      # had never actually had until this runner existed.
      - name: build
        run: cargo build --workspace --all-targets

  notify-discord:
    name: notify
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: [gate, windows]
    if: always()
    steps:
      - name: post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # A quiet no-op when the secret is unset, so a fork's CI does not fail
          # on a credential it was never going to have.
          if [ -z "${WEBHOOK}" ]; then
            echo "no DISCORD_WEBHOOK_URL configured; skipping"
            exit 0
          fi

          if [ "${{ needs.gate.result }}" = "success" ] && [ "${{ needs.windows.result }}" = "success" ]; then
            colour=7317090   # orchard
            state="passed"
          else
            colour=14310221  # russet
            state="failed"
          fi

          jq -n \
            --arg title "CI ${state}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg desc "\`${{ github.ref_name }}\` · ${{ github.event_name }} · linux ${{ needs.gate.result }}, windows ${{ needs.windows.result }}" \
            --argjson colour "${colour}" \
            '{embeds:[{title:$title, url:$url, description:$desc, color:$colour}]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "${WEBHOOK}"
