name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4

  rust-security:
    name: Rust advisories and licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny cargo-audit

      - name: check dependency policy
        run: cargo deny check

      - name: check advisories
        run: cargo audit

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  notify-discord:
    name: notify
    runs-on: ubuntu-latest
    needs: [dependency-review, rust-security, secrets]
    if: always()
    permissions: {}
    steps:
      - name: post the result
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK}" ]; then
            echo "no DISCORD_WEBHOOK_URL configured; skipping"
            exit 0
          fi
          if [ "${{ needs.dependency-review.result }}" != "failure" ] && [ "${{ needs.rust-security.result }}" = "success" ] && [ "${{ needs.secrets.result }}" = "success" ]; then
            colour=7317090
            state="passed"
          else
            colour=14310221
            state="failed"
          fi
          jq -n \
            --arg title "Security ${state}" \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg desc "\`${{ github.ref_name }}\` · ${{ github.event_name }} · dependency ${{ needs.dependency-review.result }}, Rust ${{ needs.rust-security.result }}, secrets ${{ needs.secrets.result }}" \
            --argjson colour "${colour}" \
            '{embeds:[{title:$title, url:$url, description:$desc, color:$colour}]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "${WEBHOOK}"
