name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: cellartest
          MARIADB_DATABASE: cellar
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -pcellartest --silent ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: verify release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) echo "::error::release ref must be a v* tag"; exit 1 ;; esac
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
      - name: fmt
        run: cargo fmt --all --check
      - name: docs
        run: ./scripts/check-docs.sh
      - name: examples
        run: ./scripts/check-examples.sh
      - name: generated-file drift
        run: ./scripts/check-generated.sh
      - name: build
        run: cargo build --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: install MariaDB client tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y mariadb-client
      - name: test
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: cargo test --workspace
      - name: prove database tests ran
        env:
          CELLAR_TEST_DATABASE_URL: mysql://root:cellartest@127.0.0.1:3306/cellar
        run: |
          output=$(cargo test -p cellar-store --test mysql -- --nocapture 2>&1)
          echo "$output"
          if echo "$output" | grep -q "skipping: CELLAR_TEST_DATABASE_URL is not set"; then
            echo "::error::the database tests skipped despite a configured server"
            exit 1
          fi

  validate-windows:
    name: validate release ref on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt
        run: cargo fmt --all --check
      - name: docs
        run: ./scripts/check-docs.sh
        shell: bash
      - name: examples
        run: ./scripts/check-examples.sh
        shell: bash
      - name: generated-file drift
        run: ./scripts/check-generated.sh
        shell: bash
      - name: build
        run: cargo build --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace -- --test-threads=1

  validate-browser:
    name: validate browser and accessibility
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: build browser fixtures
        run: cargo build -p cellar-cli -p cellar-fake-server
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: install browser test dependencies
        run: npm ci --prefix tests/browser
      - name: install Chromium
        run: npm exec --prefix tests/browser -- playwright install --with-deps chromium
      - name: run browser and accessibility tests
        run: npm test --prefix tests/browser

  release:
    name: build and publish
    needs: [validate, validate-windows, validate-browser]
    # Public releases use GitHub-hosted capacity so a missing private runner
    # cannot leave a pushed tag queued forever.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # `github.ref` is the tag on a tag push. The input is what makes a manual
      # re-run build the tag it was given rather than the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: build linux
        run: cargo build --release -p cellar-cli -p cellar-fake-server

      # There is no Windows runner, and the dedicated server is Windows-only, so
      # the .exe is not optional. mingw in a container produces it from here,
      # which is the path a release cut by hand already takes.
      - name: build windows
        run: ./scripts/cross-build-windows.sh

      # Two artifacts per platform: the archive the installers take, and the
      # bare binary `cellar self-update` takes, with a checksum beside each.
      # The script is the same one used by hand, so the two cannot drift.
      - name: package
        run: ./scripts/package-release.sh

      - name: generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          artifact-name: cellar-sbom
          output-file: dist/release/cellar-sbom.spdx.json
          upload-release-assets: false

      - name: checksum the SBOM
        run: sha256sum dist/release/cellar-sbom.spdx.json > dist/release/cellar-sbom.spdx.json.sha256

      # Both installers and self-update refuse anything whose checksum was not
      # published. Better to fail the release than to publish something nobody
      # can take.
      - name: every artifact has a checksum
        run: |
          set -eu
          missing=0
          for f in dist/release/*; do
            case "$f" in *.sha256) continue ;; esac
            [ -f "$f.sha256" ] || { echo "::error::no checksum for $(basename "$f")"; missing=1; }
          done
          exit "$missing"

      - name: create attestation subject manifest
        run: |
          set -eu
          : > dist/attestation-checksums.txt
          for f in dist/release/*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" >> dist/attestation-checksums.txt
          done
          test -s dist/attestation-checksums.txt

      - name: attest release artifacts and SBOM
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: dist/attestation-checksums.txt

      - name: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/release/*
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
