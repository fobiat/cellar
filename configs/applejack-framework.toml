# Full native-Linux reference configuration for AppleJack Framework under Cellar.
#
# This is a reference, not a portable default. Replace /srv paths and provide
# secrets through the environment or protected files before starting it.
# The published package ident and local project filename retain the legacy
# applejackrp compatibility slug used by s&box.

profile_file = "profiles/applejack-framework.toml"

[server]
executable = "/srv/sbox/sbox-server"
project = "/srv/applejack-framework/applejackrp.sbproj"
launcher = "native"
working_dir = "/srv/sbox"
hostname = "AppleJack Framework Dev"
data_dir = "/srv/sbox/data/fobiat/applejackrp#local"
log_file = "/srv/sbox/logs/sbox-server.log"
direct_connect = false
port = 27015
query_port = 27016
ready_pattern = "Lobby created - session is joinable"

[supervisor]
restart = "on_failure"
graceful_timeout_seconds = 30
sample_interval_seconds = 2
start_timeout_seconds = 900

[supervisor.backoff]
initial = 2
maximum = 120
multiplier = 2.0
crash_loop_threshold = 5
window = 300
healthy_after = 60

[database]
enabled = true
url_file = "/etc/cellar/applejack-database.url"
max_connections = 8
schema_owner = "gamemode"
migrate_on_start = false
event_retention_days = 90

[mariadb]
managed = false
version = "11.4.5"
sha256 = "b7c11d38657f16b837e68199d73670510aadb78f42dfa5d5fdea31a7aab342e3"
install_dir = "/var/lib/cellar/mariadb/11.4.5"
data_dir = "/var/lib/cellar/mariadb/data"
port = 33306

[backup]
enabled = true
directory = "/var/lib/cellar/backups"
interval_hours = 24
retain = 7
verify = true
copy_to = "/mnt/backups/applejack/cellar"
before_update = true

[persistence]
enabled = true
directory = "/var/lib/cellar/persistence/applejack-framework"
retain = 14
verify = true
copy_to = "/mnt/backups/applejack/persistence"

[bridge]
enabled = true
bind = "127.0.0.1:8080"
public_url = "http://127.0.0.1:8080"
auth_audience = "applejack-bridge"
auth = "trusted"
scope = "applejackrp-local"
max_body_bytes = 1048576
rate_limit_per_minute = 600

[web]
enabled = true
bind = "127.0.0.1:8081"
auth = "password"
allow_insecure_http = false
secure_cookies = false

[notify]
enabled = true
batch_seconds = 5
kinds = []

[update]
policy = "notify"
check_interval_minutes = 60
check_remote = true
only_when_empty = true
window_start_hour = 0
window_end_hour = 0
update_gamemode = true
update_engine = false
program_check = true
program_check_interval_minutes = 60

[release]
working_dir = "/srv/applejack-framework"
build_command = ["dotnet", "build", "applejackrp.sbproj"]
publish_command = ["dotnet", "run", "--project", "tools/Publish.csproj"]

# Required secret inputs, kept outside this file:
# CELLAR_WEB_PASSWORD_HASH=$(cellar hash-password)
# CELLAR_DATABASE_URL overrides database.url_file when set.
# CELLAR_GSLT supplies the Steam Game Server Login Token.
# CELLAR_BRIDGE_SECRET is required if bridge.auth becomes shared_secret.
# CELLAR_DISCORD_WEBHOOK_URL enables the Discord notifier above.
