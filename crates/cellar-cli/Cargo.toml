cellar-store = { workspace = true }
cellar-server = { workspace = true }
cellar-notify = { workspace = true }
cellar-update = { workspace = true }
cellar-tui = { workspace = true }
cellar-mariadb = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
axum = { workspace = true }
sqlx = { workspace = true }
toml = { workspace = true }
rpassword = "7"

[lints]
workspace = true
